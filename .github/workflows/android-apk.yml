name: Build Signed Android

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

concurrency:
  group: android-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed:
    name: Signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm ci

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Decode release keystore
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Missing secret RELEASE_KEYSTORE_BASE64"
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          ls -lh android/app/release.keystore

      - name: Configure release signing
        working-directory: android/app
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("build.gradle")
          text = path.read_text()

          if 'storeFile file("release.keystore")' not in text:
              release_cfg = (
                  "\n        release {\n"
                  "            storeFile file(\"release.keystore\")\n"
                  "            storePassword System.getenv(\"KEYSTORE_PASSWORD\")\n"
                  "            keyAlias System.getenv(\"KEY_ALIAS\")\n"
                  "            keyPassword System.getenv(\"KEY_PASSWORD\")\n"
                  "        }\n"
              )
              needle = "signingConfigs {\n        debug {"
              if needle not in text:
                  raise SystemExit("Could not find signingConfigs.debug block to patch")
              text = text.replace(needle, "signingConfigs {" + release_cfg + "        debug {", 1)

          # Patch ONLY buildTypes.release — never the first `release {` (signingConfigs)
          # and never buildTypes.debug (that was the previous CI bug).
          bt = text.find("buildTypes {")
          if bt < 0:
              raise SystemExit("Could not find buildTypes block")
          rel = text.find("\n        release {", bt)
          if rel < 0:
              raise SystemExit("Could not find buildTypes.release block")
          # Next sibling after release is usually packagingOptions; limit search window
          window = text[rel : rel + 800]
          old = "signingConfig signingConfigs.debug"
          new = "signingConfig signingConfigs.release"
          if old in window:
              abs_idx = rel + window.index(old)
              text = text[:abs_idx] + new + text[abs_idx + len(old) :]
          elif new not in window:
              raise SystemExit("Could not find signingConfig inside buildTypes.release")

          # Final guards
          bt_text = text[text.find("buildTypes {") :]
          rel_start = bt_text.find("\n        release {")
          rel_window = bt_text[rel_start : rel_start + 800]
          if "signingConfig signingConfigs.debug" in rel_window:
              raise SystemExit("buildTypes.release still uses signingConfigs.debug")
          if "signingConfig signingConfigs.release" not in rel_window:
              raise SystemExit("buildTypes.release missing signingConfigs.release")

          path.write_text(text)
          print("Configured release signing for APK + AAB")
          start = text.find("signingConfigs {")
          end = text.find("packagingOptions {", start)
          print(text[start:end])
          PY

      - name: Build signed APK and AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify release signing (reject debug key)
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          AAB=$(find android/app/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -z "${APK:-}" ] || [ -z "${AAB:-}" ]; then
            echo "Missing APK or AAB for verify"
            find android/app/build/outputs -type f || true
            exit 1
          fi
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          echo "Using $APKSIGNER"
          # Modern AGP signs with APK Signature Scheme v2/v3 (jarsigner reports "unsigned")
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-certs.txt
          if grep -qi "CN=Android Debug" /tmp/apk-certs.txt; then
            echo "ERROR: Artifact is still signed with the Android Debug certificate"
            exit 1
          fi
          # Newer build-tools print "V2 Signer: certificate DN:"; older print "Signer #1 certificate DN:"
          if ! grep -Eiq "certificate DN:|Signer #[0-9]+ certificate DN:" /tmp/apk-certs.txt; then
            echo "ERROR: Could not read signing certificate from APK"
            exit 1
          fi
          echo "Release signing OK (not Android Debug)"
          ls -lh "$APK" "$AAB"

      - name: Collect artifacts
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          AAB=$(find android/app/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -z "$APK" ] || [ -z "$AAB" ]; then
            echo "Missing APK or AAB"
            find android/app/build/outputs -type f || true
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/kiddo-release.apk
          cp "$AAB" dist/kiddo-release.aab
          ls -lh dist/

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kiddo-signed-apk
          path: dist/kiddo-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: kiddo-signed-aab
          path: dist/kiddo-release.aab
          if-no-files-found: error
          retention-days: 90
