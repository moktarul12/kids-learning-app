name: Build Signed Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed:
    name: Signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm ci

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Decode release keystore
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Missing secret RELEASE_KEYSTORE_BASE64"
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          ls -lh android/app/release.keystore

      - name: Configure release signing
        working-directory: android/app
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("build.gradle")
          text = path.read_text()

          release_cfg = (
              "\n        release {\n"
              "            storeFile file(\"release.keystore\")\n"
              "            storePassword System.getenv(\"KEYSTORE_PASSWORD\")\n"
              "            keyAlias System.getenv(\"KEY_ALIAS\")\n"
              "            keyPassword System.getenv(\"KEY_PASSWORD\")\n"
              "        }\n"
          )

          if 'storeFile file("release.keystore")' not in text:
              text = text.replace(
                  "signingConfigs {\n        debug {",
                  "signingConfigs {" + release_cfg + "        debug {",
                  1,
              )

          text2, n = re.subn(
              r"(release\s*\{[\s\S]*?)signingConfig signingConfigs\.debug",
              r"\1signingConfig signingConfigs.release",
              text,
              count=1,
          )
          if n:
              text = text2
          elif "signingConfig signingConfigs.release" not in text:
              raise SystemExit("Could not set release signingConfig")

          path.write_text(text)
          print("Configured release signing for APK + AAB")
          PY

      - name: Build signed APK and AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect artifacts
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          AAB=$(find android/app/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -z "$APK" ] || [ -z "$AAB" ]; then
            echo "Missing APK or AAB"
            find android/app/build/outputs -type f || true
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/kiddo-release.apk
          cp "$AAB" dist/kiddo-release.aab
          ls -lh dist/

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kiddo-signed-apk
          path: dist/kiddo-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: kiddo-signed-aab
          path: dist/kiddo-release.aab
          if-no-files-found: error
          retention-days: 90
